<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verified Bounty Radar</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;background:#0b0d10;color:#edf2f7}a{color:#7dd3fc}.muted{color:#94a3b8}.card{border:1px solid #273244;border-radius:12px;padding:16px;margin:12px 0;background:#11151b}.tag{display:inline-block;border:1px solid #334155;border-radius:999px;padding:3px 8px;margin-right:6px;font-size:12px}.watch{border-color:#16a34a}.competitive{border-color:#f59e0b}.avoid_crowded,.skip_claimed,.skip_closed{border-color:#ef4444}code{background:#19202b;padding:2px 5px;border-radius:5px}button{padding:8px 12px;border-radius:8px;border:0;cursor:pointer}pre{overflow:auto;background:#11151b;padding:12px;border-radius:10px}
</style>
</head>
<body>
<h1>Verified Bounty Radar</h1>
<p>Machine-readable verification for software bounties: canonical state, reward evidence, open PR competition, claim status, and a skip/watch recommendation.</p>
<p class="muted" id="meta">Loading live feed…</p>
<p><a href="feed.json">Raw JSON feed</a> · <a href="sample_feed.json">Hand-verified sample</a> · <a href="https://github.com/a40014859-gif/verified-bounty-radar">Source</a></p>
<div id="records"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('feed.json?'+Date.now()).then(r=>r.json()).then(d=>{
 document.getElementById('meta').textContent=`${d.record_count} verified records · refreshed ${d.generated_at}`;
 document.getElementById('records').innerHTML=d.records.map(x=>{
  const reward=x.reward?`${x.reward.amount} ${x.reward.currency}`:'unverified';
  const pr=x.open_pr_competition==null?'unknown':x.open_pr_competition;
  const claim=x.claim?.state||'unknown';
  return `<div class="card ${esc(x.recommendation)}"><h3><a href="${esc(x.canonical_url)}">${esc(x.title)}</a></h3><span class="tag">${esc(x.recommendation)}</span><span class="tag">reward: ${esc(reward)}</span><span class="tag">open PRs: ${esc(pr)}</span><span class="tag">claim: ${esc(claim)}</span><p class="muted">${esc(x.repository)} #${esc(x.issue_number)} · state ${esc(x.state)} · verified ${esc(x.verified_at)}</p></div>`;
 }).join('');
}).catch(e=>{document.getElementById('meta').textContent='Live feed has not been generated yet.'});
</script>
</body>
</html>
