name: Refresh public bounty feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: verified-bounty-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_feed.py
      - name: Commit changed feed
        run: |
          if [ -z "$(git status --porcelain -- feed.json)" ]; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "verified-bounty-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Refresh verified bounty feed"
          git pull --rebase origin main
          git push origin HEAD:main
